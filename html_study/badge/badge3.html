<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배지 예제2 - 스크롤하면 나타나는 맨 위로 버튼</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <link rel="stylesheet" href="./css/badge3.css" />
    <script src="./js/badge3.js" defer></script>
  </head>
  <body>
    <header>스크롤을 400px이상 내려 보세요</header>
    <p>
      왼쪽 아래에 이벤트 배지가 통통 튀며 나타납니다. 닫기(X)를 우르면 다시는
      나타나지 않습니다 부드럽게 맨 위로 이동 합나다.
    </p>
    <div class="promo-badge">
      <div class="icon">🎁</div>
      <div class="text">
        <strong>신규 가입 이벤트</strong>
        <span>지금 가임하면 쿠폰증정</span>
      </div>
      <button class="close" aria-label="닫기">x</button>
    </div>
  </body>
</html>
