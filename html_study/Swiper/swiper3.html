<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>슬라이드화면</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./css/swiper3.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="./js/swiper3.js" defer></script>
  </head>
  <body>
    <div class="swiper mainSwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="./images/img1.jpg" alt="AI 교육" />

          <div class="slideText">
            <h2>AI와 함께하는 새로운 교육</h2>
            <p>생성형 AI를 활용한 실무 교육</p>
            <a href="#">자세히 보기</a>
          </div>
        </div>

        <div class="swiper-slide">
          <img src="./images/img2.jpg" alt="웹 개발" />

          <div class="slideText">
            <h2>웹 개발을 쉽게 시작하세요</h2>
            <p>HTML, CSS, JavaScript부터 React까지</p>
            <a href="#">자세히 보기</a>
          </div>
        </div>

        <div class="swiper-slide">
          <img src="./images/img3.jpg" alt="데이터 분석" />

          <div class="slideText">
            <h2>데이터를 가치 있게</h2>
            <p>Python을 활용한 데이터 분석</p>
            <a href="#">자세히 보기</a>
          </div>
        </div>
      </div>

      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>

      <div class="swiper-pagination"></div>
    </div>
  </body>
</html>
