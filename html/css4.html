<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 400px;
        height: 300px;
        border: 2px solid #333;
        margin: 50px;
        position: relative;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: #3498db;
        border: 2px solid #333;
        color: white;
        text-align: center;
        line-height: 100px;
        font-weight: bold;
        position: absolute;
        left: 120px;
        top: 80px;
      }
      .fixed-button {
        position: fixed;
        bottom: 20px; /* 화면 하단에서 20px */
        right: 20px; /* 화면 우측에서 20px */
        width: 60px;
        height: 60px;
        background-color: #9b59b6;
        color: white;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 24px;
      }
      .popup {
        position: fixed;
        top: 70%;
        left: 20%;
        transform: translate(-50%, -50%); /* 정확한 중앙 정렬 */
        width: 300px;
        height: 200px;
        background-color: white;
        border: 1px solid #ddd;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000; /* 다른 요소 위에 표시 */
      }
    </style>
  </head>
  <body>
    <div></div>
    <div class="container">
      <div class="box" id="box1">Box 1</div>
      <div class="box" id="box2">Box 2</div>
      <div class="box popup" id="box3">Box 3</div>
    </div>
    <button class="fixed-button">↑</button>
  </body>
</html>
