<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="aa.jsp" method="get">
      <label for="idName">아이디</label>
      <input
        type="text"
        name="id"
        id="idName"
        required
        placeholder="아이디는 이메일"
        maxlength="7"
        size="8"
        value="admin"
        readonly
      />
      <br />
      <label for="pwd">비밀번호</label>
      <input
        type="password"
        name="pw"
        id="pwd"
        required
        placeholder="대문자소문자8자이상"
      />
      <br />

      <input type="hidden" name="id" id="phone" value="010-1234-5678" />
      <br />
      <input type="submit" value="로그인" />
    </form>
  </body>
</html>
