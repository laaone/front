<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .magic-button {
        background-color: #3498db;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s ease;
      }
      .magic-button:hover {
        background-color: #2980b9;
        transform: translateY(-2) translateX(-2);
      }
      .magic-button:active {
        background-color: #1f618d;
        transform: translateY(0);
        color: #aaa;
      }
      .magic-button:focus {
        outline: 3px solid #f39c12;
        outline-offset: 2px;
      }
      .team-list {
        list-style: none;
        padding: 0;
        max-width: 400px;
        margin: 20px auto;
      }
      .team-list li {
        padding: 15px;
        margin: 5px 0;
        background-color: #ecf0f1;
        border-radius: 5px;
      }
      .team-list li:first-child {
        background-color: #f39c12;
        color: #fff;
        font-weight: 700px;
      }

      /* 짝수 번째는 다른 색으로 */
      .team-list li:nth-child(even) {
        background-color: #d5dbdb;
      }

      /* 3번째는 특별한 색으로 */
      .team-list li:nth-child(3n) {
        background-color: #9b59b6;
        color: white;
      }
      .team-list li:last-child {
        background-color: #e45d34;
        color: #fff;
        font-weight: 300px;
      }
      .navbar {
        background-color: #2c3e50;
        padding: 0;
        margin: 0;
        list-style: none;
        display: flex;
        justify-content: center;
      }
      .navbar li {
        position: relative;
      }

      .navbar a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 15px 25px;
        transition: all 0.3s ease;
      }
      /* 마우스 오버 효과 */
      .navbar a:hover {
        background-color: #34495e;
        color: #3498db;
      }
      /* 현재 페이지 표시 */
      .navbar a.current {
        background-color: #3498db;
        color: white;
      }
      /* 첫 번째 메뉴 모서리 둥글게 */
      .navbar li:first-child a {
        border-top-left-radius: 20px;
        border-bottom-left-radius: 20px;
      }

      /* 마지막 메뉴 모서리 둥글게 */
      .navbar li:last-child a {
        border-top-right-radius: 30px;
        border-bottom-right-radius: 5px;
      }
      /* 방문한 링크도 기본 색상 유지 */
      .navbar a:visited {
        color: rgb(238, 113, 10);
      }

      .navbar a.current:visited {
        color: rgb(240, 84, 12);
      }
    </style>
  </head>

  <body>
    <button class="magic-button">마법의 버튼</button>

    <p>버튼에 마우스를 올려보고, 클릭해 보고, 탭키로 포커스를 맞춰보세요</p>
    <hr />
    <ul class="team-list">
      <li>김팀장(리더)</li>
      <li>박개발자</li>
      <li>이디자이너(특별한 3번째)</li>
      <li>최기획자</li>
      <li>정신입</li>
      <li>정신입</li>
      <li>정신입</li>
      <li>정신입</li>
      <li>정신입</li>
    </ul>
    <hr />
    <ul class="navbar">
      <li><a href="./css.html" class="current">홈</a></li>
      <li><a href="https://www.naver.com">소개</a></li>
      <li><a href="javascript:void(0)">서비스</a></li>
      <li><a href="javascript:void(0)">포트폴리오</a></li>
      <li><a href="javascript:void(0)">연락처</a></li>
    </ul>
  </body>
</html>
