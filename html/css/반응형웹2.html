<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
 .container {
 max-width: 1200px;
 margin: 0 auto;
 padding: 20px;
 }

 /* 기본 반응형 이미지 */
 .responsive-img {
 max-width: 100%;
 height: auto;
 display: block;
 margin: 20px 0;
 }

 /* 이미지 갤러리 */
 .gallery {
 display: flex;
 flex-wrap: wrap;
 gap: 10px;
 }

 .gallery img {
 flex: 1 1 300px;
 max-width: 100%;
 height: 200px;
 object-fit: cover;
 }
 </style>
</head>
<body>
  <div class="container">
 <h1>반응형 이미지 갤러리</h1>

 <!-- 단일 반응형 이미지 -->
 <img src="https://picsum.photos/800/400"
 alt="반응형 테스트 이미지"
 class="responsive-img">

 <!-- 이미지 갤러리 -->
 <div class="gallery">
 <img src="https://picsum.photos/300/200?random=1" alt="갤러리 1">
 <img src="https://picsum.photos/300/200?random=2" alt="갤러리 2">
 <img src="https://picsum.photos/300/200?random=3" alt="갤러리 3">
 </div>
</body>
</html>
