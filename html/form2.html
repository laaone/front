<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 폼</title>
  </head>
  <body>
    <h2>회원가입</h2>
    <form action="a.jsp" method="=get">
      <!-- 사용자에게 보이는 입력 필드들 -->
      <p>
        <label for="email">이메일:</label><br />
        <input type="email" id="email" name="email" required />
      </p>
      <p>
        <label for="newPassword">비밀번호:</label><br />
        <input
          type="password"
          id="newPassword"
          name="password"
          minlength="2"
          required
        />
      </p>
      <p>
        <label for="confirmPassword">비밀번호 확인:</label><br />
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          minlength="2"
          required
        />
      </p>

      <!-- 숨겨진 정보들 (사용자에게는 보이지 않음) -->
      <input type="hidden" name="signup_source" value="main_page" />
      <input type="hidden" name="referrer" value="google_ads" />
      <input type="hidden" name="form_version" value="2.1" />

      <input type="checkbox" name="h1" id="h1" value="독서" />
      <label for="h1">독서</label>
      <input type="checkbox" name="h2" id="h2" value="컴퓨터" />
      <label for="h2">컴퓨터</label>
      <input type="checkbox" name="h3" id="h3" value="운동" />
      <label for="h3">운동</label>
      <p></p>
      <input type="radio" name="gender" id="male" value="1" />
      <label for="male">남자</label>
      <input type="radio" name="gender" id="female" value="0" />
      <label for="female">여자</label>

      <p>드롭박스</p>
      <label for="region-grouped">거주지역</label>
      <select name="region" id="region-grouped" multiple size="3">
        <option value="">지역을 선택하세요</option>
        <optgroup label="특별시/광역시">
          <option value="seoul">서울</option>
          <option value="busan">부산</option>
          <option value="daegu">대구</option>
          <option value="incheon">인천</option>
        </optgroup>
        <optgroup label="도 지역">
          <option value="kyeonggi">경기도</option>
          <option value="gamgwon">강원도</option>
          <option value="chungbuk">충청북도</option>
          <option value="chungnam">충청남도</option>
        </optgroup>
      </select>

      <p>여러줄 입력</p>
      <textarea
        name="bigo"
        id="bigo"
        cols="30"
        rows="10"
        placeholder="하고 싶은 말을 편하게 써주세요"
      ></textarea>
      <button type="submit">회원가입</button>
    </form>

    <script>
      // 폼이 전송될 때 숨겨진 값들도 함께 전송되는지 확인
      document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault(); // 실제 전송은 막고 콘솔에서 확인

        const formData = new FormData(this);
        console.log("전송될 데이터:");
        for (let [key, value] of formData.entries()) {
          if (key.includes("password")) {
            console.log(key + ": " + "●".repeat(value.length));
          } else {
            console.log(key + ": " + value);
          }
        }
      });
    </script>
  </body>
</html>
